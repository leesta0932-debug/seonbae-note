/* 사진을 1200px 이하로 줄여 글자로 바꾼다. DB 연결 시에는 Supabase Storage에 올리고 주소만 저장한다. */
const readImage = file => new Promise((res, rej) => {
  if(!file) return res(null);
  if(!file.type.startsWith("image/")) return rej(new Error("type"));
  const fr = new FileReader();
  fr.onload = () => { const img = new Image();
    img.onload = () => { const s = Math.min(1, 1200 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", 0.85)); };
    img.onerror = rej; img.src = fr.result; };
  fr.onerror = rej; fr.readAsDataURL(file);
});

const qRow = (q, showGrade) => `<button class="row${isWide() && S.sel === q.id ? " sel" : ""}" data-act="openQ" data-q="${q.id}" data-qtext="${esc((q.title+" "+q.body).toLowerCase())}"${matchQ(q) ? "" : " hidden"}><span class="meta">${qStatus(q)}${q.image?'<span class="tag">사진</span>':""}<span>${showGrade?`${q.grade}학년 · `:""}${esc(q.subject)}</span><span class="tag">${esc(q.stuck)}</span></span>
  <span class="t">${esc(q.title)}</span><span class="meta">${ago(q.at)} · 답변 ${visible(q).length}${q.assignedTo?` · 담당 ${esc(nameOf(q.assignedTo))}`:""}</span></button>`;
const pairRow = ([q, a], extra) => `<button class="row${isWide() && S.sel === q.id ? " sel" : ""}" data-act="openQ" data-q="${q.id}"><span class="meta"><span>${q.grade}학년 · ${esc(q.subject)}</span>${extra}</span>
  <span class="t">${esc(q.title)}</span><span class="note">${esc(nameOf(a.author))}: ${esc(a.text.length > 60 ? a.text.slice(0,60)+"…" : a.text)}</span></button>`;

/* ----- 홈 ----- */
function studentHome(){
  const u = me();
  const mine = store.questions.filter(q => q.grade === u.grade);
  const myLogs = store.logs.filter(l => l.owner === u.email);
  let top = `<div class="stat"><div><b>${mine.length}</b><span>${u.grade}학년 질문</span></div>
    <div><b>${mine.filter(q => !visible(q).length).length}</b><span>답변 대기</span></div><div><b>${myLogs.length}</b><span>내 활동 기록</span></div></div>
    <button class="btn" data-act="ask" style="${isWide() ? "max-width:240px" : ""}">질문하기</button>`;
  let left = "", right = "";
  if(u.mentor){
    const myA = pairs(a => a.author === u.email && a.status === "visible");
    const assigned = store.questions.filter(q => q.assignedTo === u.email && !visible(q).length);
    const fix = pairs(a => a.author === u.email && a.status === "revising");
    left += `<div class="info"><span class="t">내 멘토 활동</span><span>공개된 답변 ${myA.length} · 교사 확인 ${myA.filter(([,a]) => a.confirmed).length}</span>
      <span class="fine">선생님 확인을 받은 답변은 내 기록장에 자동으로 기록돼요.</span></div>
      <section><h2>나에게 배정된 질문</h2><div class="list">${assigned.map(q => qRow(q, true)).join("") || empty("배정된 질문이 없어요.")}</div></section>
      <section><h2>수정 요청 받은 내 답변</h2><div class="list">${fix.map(p => pairRow(p, '<span class="pill bad">수정 요청</span>')).join("") || empty("수정 요청이 없어요.")}</div></section>`;
  }
  left += `<section><h2>최근 질문</h2><div class="list">${mine.slice().sort((a,b) => b.at-a.at).slice(0,4).map(q => qRow(q)).join("") || empty("아직 질문이 없어요.")}</div></section>`;
  right += `<section><h2>최근 활동 기록</h2><div class="list">${myLogs.slice(0,3).map(logRow).join("") || empty("아직 기록이 없어요.")}</div></section>`;
  return top + `<div class="split"><div>${left}</div><div>${right}</div></div>`;
}

function noticeArea(){
  const isT = me().role === "teacher";
  const list = store.notices.filter(n => n.grade === S.grade && (n.subject === "전체" || n.subject === S.subject));
  const exact = store.notices.find(n => n.grade === S.grade && n.subject === S.subject);
  let h = list.map(n => `<div class="notice"><span class="label">공지 · ${n.subject==="전체" ? `${n.grade}학년 전체` : esc(n.subject)}</span><p>${esc(n.text)}</p>
    <span class="meta">${esc(nameOf(n.by))} · ${fmtDate(n.at)}</span>${isT ? `<div class="actions"><button class="sbtn" data-act="noticeRemove" data-v="${n.id}">공지 내리기</button></div>` : ""}</div>`).join("");
  if(isT){
    const where = `${S.grade}학년 ${S.subject}`;
    h += S.ui?.mode === "notice"
      ? `<form data-form="notice" class="box" novalidate><div class="field"><label for="nText">${esc(where)} 공지</label><textarea id="nText">${exact ? esc(exact.text) : ""}</textarea></div>
         <p class="err" hidden></p><div class="actions"><button class="sbtn primary" type="submit">고정하기</button><button class="sbtn" type="button" data-act="uiClose">취소</button></div></form>`
      : `<button class="btn ghost" data-act="noticeEdit">${exact ? `${esc(where)} 공지 수정` : `${esc(where)} 공지 고정`}</button>`;
  }
  return h;
}
function qaList(){

      <select id="qSort" aria-label="정렬"><option value="new" ${S.sort==="new"?"selected":""}>최신순</option><option value="wait" ${S.sort==="wait"?"selected":""}>답변 대기 먼저</option></select></div>

/* ----- 질문 상세 ----- */
function inlineForm(q, a){
  const ui = S.ui; if(!ui || ui.a !== a.id) return "";
  const attrs = `data-q="${q.id}" data-a="${a.id}" class="box" novalidate`;
  const btns = label => `<p class="err" hidden></p><div class="actions"><button class="sbtn primary" type="submit">${label}</button><button class="sbtn" type="button" data-act="uiClose">취소</button></div>`;
  switch(ui.mode){
    case "hide": return `<form data-form="hide" ${attrs}><div class="field"><label for="hReason">숨기는 이유</label><select id="hReason">${REASONS.map(r => `<option>${r}</option>`).join("")}</select></div>
      <div class="field"><label for="hMemo">짧은 설명 (선택)</label><input id="hMemo" placeholder="예: 관성의 크기는 질량으로 정해져요."></div>
      <p class="fine">학생에게는 답변 대신 숨긴 이유가 보여요. 나중에 다시 공개할 수 있어요.</p>${btns("숨기기")}</form>`;
    case "req": return `<form data-form="req" ${attrs}><div class="field"><label for="rNote">멘토에게 보낼 수정 요청</label><textarea id="rNote" placeholder="어떤 부분이 왜 틀렸는지, 어떻게 고치면 좋을지 적어 주세요."></textarea></div>${btns("요청 보내기")}</form>`;
    case "sup": return `<form data-form="sup" ${attrs}><div class="field"><label for="sText">보충 설명</label><textarea id="sText" placeholder="멘토 답변에 덧붙일 설명"></textarea></div>${btns("덧붙이기")}</form>`;
    case "corr": return `<form data-form="corr" ${attrs}><div class="field"><label for="cNote">정정 요청 내용</label><textarea id="cNote" placeholder="어느 부분을 어떻게 고치면 좋을지 적어 주세요. 선생님 검토함으로 가요."></textarea></div>${btns("보내기")}</form>`;
    case "del": return `<form data-form="del" ${attrs}><p>이 답변을 삭제하면 되돌릴 수 없어요. 삭제할까요?</p><div class="actions"><button class="sbtn danger" type="submit">삭제</button><button class="sbtn" type="button" data-act="uiClose">취소</button></div></form>`;
  }
  return "";
}
function answerBlock(q, a){
  const u = me(), isT = u.role === "teacher", mine = a.author === u.email, vis = a.status === "visible";
  const d = `data-q="${q.id}" data-a="${a.id}"`;
  if(!vis && !isT && !mine){
    const msg = a.status === "hidden" ? "선생님이 검토 중인 답변이에요." : a.status === "revising" ? "멘토가 답변을 고치는 중이에요." : "멘토가 고친 답변을 선생님이 확인하고 있어요.";
    return `<div class="answer dim"><span class="by">${esc(nameOf(a.author))}${roleBadge(a.author)}</span><p class="note">${msg} 사유: ${esc(a.hide?.reason || "검토 중")}</p></div>`;
  }
  let h = `<div class="answer ${vis?"":"dim"}"><span class="by">${esc(nameOf(a.author))}${roleBadge(a.author)}${vis?"":`<span class="pill bad">${STATUS_LABEL[a.status]}</span>`}${a.confirmed?'<span class="pill ok">교사 확인</span>':""}</span>
    <p>${esc(a.text)}</p>${a.image?`<img class="qimg" src="${a.image}" alt="답변에 첨부한 사진">`:""}<span class="meta">${ago(a.at)}${a.revisedAt?" · 수정됨":""}</span>`;
  if(a.confirmed) h += `<span class="fine">교사 확인 · ${esc(nameOf(a.confirmed.by))} · ${fmtDate(a.confirmed.at)}</span>`;
  if(a.hide) h += `<div class="info"><span class="t">숨긴 이유: ${esc(a.hide.reason)}</span>${a.hide.memo?`<span>${esc(a.hide.memo)}</span>`:""}<span class="fine">${esc(nameOf(a.hide.by))} · ${fmtDate(a.hide.at)}</span></div>`;
  if(a.revision) h += `<div class="info"><span class="t">수정 요청</span><span>${esc(a.revision.note)}</span><span class="fine">${esc(nameOf(a.revision.by))} · ${fmtDate(a.revision.at)}</span></div>`;
  h += a.supplements.map(s => `<div class="sup"><span class="by">보충 설명 · ${esc(nameOf(s.by))}</span><p>${esc(s.text)}</p></div>`).join("");
  if(isT && vis && (a.confusedBy.length || a.corrections.length)){
    h += `<div class="info">${a.confusedBy.length?`<span class="flag">이해가 안 된다는 학생 ${a.confusedBy.length}명</span>`:""}
      ${a.corrections.map(c => `<span><span class="flag">정정 요청</span> ${esc(nameOf(c.by))}: ${esc(c.note)}</span>`).join("")}</div>`;
  }
  let acts = "";
  if(isT){
    if(vis) acts = `${a.confirmed || findUser(a.author)?.role === "teacher" ? "" : `<button class="sbtn primary" data-act="confirm" ${d}>교사 확인</button>`}
      <button class="sbtn" data-act="ui" data-v="sup" ${d}>보충 설명</button><button class="sbtn" data-act="ui" data-v="hide" ${d}>숨기기</button>
      ${a.confusedBy.length||a.corrections.length?`<button class="sbtn" data-act="clearFlags" ${d}>검토 완료</button>`:""}`;
    else if(a.status === "hidden") acts = `<button class="sbtn primary" data-act="restore" ${d}>다시 공개</button><button class="sbtn" data-act="ui" data-v="req" ${d}>멘토에게 수정 요청</button><button class="sbtn danger" data-act="ui" data-v="del" ${d}>삭제</button>`;
    else if(a.status === "revising") acts = `<button class="sbtn" data-act="restore" ${d}>요청 취소하고 공개</button><button class="sbtn danger" data-act="ui" data-v="del" ${d}>삭제</button>`;
    else acts = `<button class="sbtn primary" data-act="restore" ${d}>수정본 공개</button><button class="sbtn" data-act="ui" data-v="req" ${d}>다시 수정 요청</button><button class="sbtn danger" data-act="ui" data-v="del" ${d}>삭제</button>`;
  } else if(mine && a.status === "revising"){
    h += `<form data-form="revise" data-q="${q.id}" data-a="${a.id}" class="box" novalidate><div class="field"><label for="rvText">답변 고치기</label><textarea id="rvText">${esc(a.text)}</textarea></div>
      <p class="err" hidden></p><button class="sbtn primary" type="submit" style="align-self:flex-start">고친 답변 제출</button><p class="fine">제출하면 선생님이 확인한 뒤 다시 공개돼요.</p></form>`;
  } else if(vis && !mine){

    acts = `<button class="sbtn ${on?"on":""}" data-act="confused" ${d}>${on?"이해가 안 돼요 표시함":"이해가 안 돼요"}</button>${!u.mentor ? "" : a.corrections.some(c => c.by === u.email) ? '<span class="fine">정정 요청을 보냈어요</span>' : `<button class="sbtn" data-act="ui" data-v="corr" ${d}>정정 요청</button>`}`;

function queueView(){
  const seg = `<div class="seg">${QUEUES.map(([k,n,f,short]) => `<button data-act="qtab" data-v="${k}" class="${S.queueTab===k?"on":""}">${short} ${f().length}</button>`).join("")}</div>`;
  const mentors = store.users.filter(u => u.mentor);
  let body = `<p class="note">${queueNote[S.queueTab]}</p>`;
  if(S.queueTab === "unanswered"){
    body += unanswered().map(q => `<div class="box"><span class="meta"><span class="pill wait">${waiting(q.at)}</span><span>${q.grade}학년 · ${esc(q.subject)}</span><span class="tag">${esc(q.stuck)}</span></span>
      <span class="t">${esc(q.title)}</span><span class="note">${q.assignedTo ? `담당: ${esc(nameOf(q.assignedTo))}` : "담당 멘토 없음"}</span>
      <form data-form="assign" data-q="${q.id}" class="actions" novalidate><select aria-label="담당 멘토" style="flex:1;min-width:0"><option value="">담당 멘토 없음</option>${mentors.map(m => `<option value="${m.email}" ${q.assignedTo===m.email?"selected":""}>${esc(nameOf(m.email))}</option>`).join("")}</select>

    <p class="err" hidden></p><button class="btn" type="submit">후기 올리기</button></form>`;
}

/* ===== 이벤트 ===== */
const pwProblem = (np, np2) => np.length < 8 ? "비밀번호는 8자 이상이어야 해요." : np !== np2 ? "두 비밀번호가 서로 달라요." : "";
const openQuestion = qid => {
  const q = findQ(qid);
  if(isWide()){ if(S.tab !== "queue"){ S.tab = "qa"; if(q){ S.grade = q.grade; S.subject = "전체"; S.qsearch = ""; } } S.sel = qid; S.view = null; }
  else S.view = {type:"question", id:qid};
  S.ui = null;
};

document.addEventListener("click", async e => {
  const pwb = e.target.closest("[data-pw]");
  if(pwb){ const inp = document.getElementById(pwb.dataset.pw), show = inp.type === "password";
    inp.type = show ? "text" : "password"; pwb.textContent = show ? "숨기기" : "보기"; pwb.setAttribute("aria-label", show ? "비밀번호 숨기기" : "비밀번호 보기"); return; }
  const el = e.target.closest("[data-act]"); if(!el) return;
  const {act, v} = el.dataset, qid = Number(el.dataset.q), aid = Number(el.dataset.a), u = me();
  switch(act){
    case "theme": { const t = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = t;
      try { localStorage.setItem("sbn-theme", t); } catch(err) {} break; }
    case "auth": S.draft.email = $("#email")?.value ?? S.draft.email; S.auth = v;
      S.flow = v === "signup" ? {purpose:"signup", role:"student", email:""} : v === "reset" ? {purpose:"reset", email:""} : null; break;
    case "srole": S.flow.email = $("#semail").value; S.flow.role = v; break;
    case "resend": S.flow.code = await api.sendCode(S.flow.email); toast("인증 메일을 다시 보냈어요"); break;
    case "logout": await api.logout(); Object.assign(S, {me:null, auth:"login", flow:null, view:null, sel:null, ui:null, tab:"home", draft:{}, qsearch:"", rosterMsg:""}); break;
    case "tab": S.tab = v; S.view = null; S.ui = null; S.sel = null; S.qsearch = ""; break;
    case "account": S.view = {type:"account"}; S.ui = null; break;
    case "back": S.view = null; S.ui = null; break;
    case "openQ": openQuestion(qid); break;
    case "ask": if(isWide()){ S.tab = "qa"; S.grade = u.grade; S.subject = "전체"; } S.view = {type:"ask"}; break;
    case "grade": S.grade = Number(v); S.subject = "전체"; S.ui = null; S.sel = null; break;
    case "sub": S.subject = v; S.ui = null; S.sel = null; break;
    case "ui": S.ui = {mode:v, a:aid}; break;
    case "uiClose": S.ui = null; break;
    case "confirm": await api.confirmAnswer(qid, aid, u.email); toast("교사 확인을 했어요"); break;
    case "restore": await api.restoreAnswer(qid, aid); S.ui = null; toast("답변을 공개했어요"); break;
    case "confused": await api.toggleConfused(qid, aid, u.email); break;
    case "clearFlags": await api.clearFlags(qid, aid); toast("검토를 완료했어요"); break;
    case "queue": S.tab = "queue"; S.queueTab = v; S.view = null; S.sel = null; break;
    case "qtab": S.queueTab = v; S.sel = null; break;
    case "qgrade": S.qGrade = v; S.sel = null; break;
    case "mentor": { const on = el.dataset.on === "1"; await api.setMentor(v, on); toast(on ? "멘토로 지정했어요" : "멘토를 해제했어요"); break; }
    case "writeReview": S.view = {type:"review"}; break;
    case "rdetail": S.view = {type:"reviewDetail", id:Number(v)}; break;
    case "rhide": { const on = el.dataset.on === "1"; await api.setReviewHidden(Number(v), on); toast(on ? "후기를 숨겼어요" : "후기를 다시 공개했어요"); break; }
    case "rreportOpen": S.ui = {mode:"rreport", r:Number(v)}; break;
    case "rclear": await api.clearReviewReports(Number(v)); toast("신고를 확인했어요"); break;
    case "noticeEdit": S.ui = {mode:"notice"}; break;
    case "noticeRemove": await api.removeNotice(Number(v)); toast("공지를 내렸어요"); break;
    default: return;
  }
  render();
});

document.addEventListener("submit", async e => {
  const f = e.target, kind = f.dataset.form; if(!kind) return;
  e.preventDefault();
  const val = id => (f.querySelector("#"+id)?.value || "").trim();
  const raw = id => f.querySelector("#"+id)?.value || "";
  const fail = msg => { const p = f.querySelector(".err"); if(p){ p.textContent = msg; p.hidden = false; } };
  const qid = Number(f.dataset.q), aid = Number(f.dataset.a), u = me();
  switch(kind){
    case "login": {
      S.draft.email = raw("email");
      const r = await api.login(raw("email"), raw("pw"), f.querySelector("#keep").checked);
      if(r.error) return fail(r.error);
      await api.loadAll();
      Object.assign(S, {me:r.user.email, grade:r.user.grade || 2, subject:"전체", tab:"home", view:null, sel:null, draft:{}}); break;
    }
    case "signup": {
      const email = val("semail").toLowerCase(); S.flow.email = email;
      const r = await api.checkSignup(email, S.flow.role); if(r.error) return fail(r.error);
      if(DB){ S.auth = "setpw"; break; }   // 시연 기간: 인증 메일 없이 바로 비밀번호 정하기
      S.flow.code = await api.sendCode(email); S.auth = "verify"; toast("인증 메일을 보냈어요"); break;
    }
    case "reset": {
      const email = val("remail").toLowerCase(); S.flow.email = email;
      if(DB) return fail("시연 기간에는 비밀번호 찾기를 쓸 수 없어요. 담당 선생님께 문의해 주세요.");
      if(!findUser(email)) return fail("가입하지 않은 이메일이에요. 이메일을 다시 확인해 주세요.");
      S.flow.code = await api.sendCode(email); S.auth = "verify"; toast("인증 메일을 보냈어요"); break;
    }
    case "verify": if(!(await api.verifyCode(S.flow.email, val("code")))) return fail("인증 코드가 맞지 않아요. 메일을 다시 확인해 주세요."); S.auth = "setpw"; break;
    case "setpw": {
      const fl = S.flow;
      if(fl.purpose === "signup" && fl.role === "teacher" && !val("tname")) return fail("이름을 적어 주세요.");
      const p = pwProblem(raw("np"), raw("np2")); if(p) return fail(p);
      if(fl.purpose === "signup"){
        const nu = await api.createAccount(fl.email, fl.role, raw("np"), val("tname"));
        Object.assign(S, {me:nu.email, auth:"login", flow:null, grade:nu.grade || 2, subject:"전체", tab:"home", view:null, sel:null}); toast("가입했어요. 환영해요!");
      } else {
        await api.resetPassword(fl.email, raw("np"));
        Object.assign(S, {auth:"login", flow:null, draft:{email:fl.email}}); toast("비밀번호를 바꿨어요. 새 비밀번호로 로그인하세요");
      }
      break;
    }
    case "changePw": {
      if(!(await api.checkPassword(u.email, raw("cp")))) return fail("현재 비밀번호가 맞지 않아요.");
      const p = pwProblem(raw("np"), raw("np2")); if(p) return fail(p);
      await api.changePassword(u.email, raw("np")); S.view = null; toast("비밀번호를 바꿨어요"); break;
    }
    case "ask": {
      if(!val("aTitle") || !val("aBody")) return fail("제목과 내용을 모두 적어 주세요.");
      const image = await readImage(f.querySelector("#aImg").files[0]).catch(() => "bad");
      if(image === "bad") return fail("사진 파일만 올릴 수 있어요.");
      const id = await api.addQuestion({grade:u.grade, subject:val("aSub"), stuck:val("aStuck"), title:val("aTitle"), body:val("aBody"), author:u.email, image});
      S.tab = "qa"; S.grade = u.grade; S.subject = "전체"; S.qsearch = "";
      if(isWide()){ S.sel = id; S.view = null; } else S.view = {type:"question", id};
      toast("질문을 올렸어요"); break;
    }
    case "answer": {
      if(!val("ans")) return fail("답변 내용을 적어 주세요.");
      const image = await readImage(f.querySelector("#ansImg").files[0]).catch(() => "bad");
      if(image === "bad") return fail("사진 파일만 올릴 수 있어요.");
      await api.addAnswer(qid, u.email, val("ans"), image); toast("답변을 등록했어요"); break;
    }
    case "hide": await api.hideAnswer(qid, aid, u.email, val("hReason"), val("hMemo")); S.ui = null; toast("답변을 숨겼어요"); break;
    case "req": if(!val("rNote")) return fail("요청 내용을 적어 주세요."); await api.requestRevision(qid, aid, u.email, val("rNote")); S.ui = null; toast("수정 요청을 보냈어요"); break;
    case "sup": if(!val("sText")) return fail("설명을 적어 주세요."); await api.addSupplement(qid, aid, u.email, val("sText")); S.ui = null; toast("보충 설명을 덧붙였어요"); break;
    case "corr": if(!val("cNote")) return fail("정정할 내용을 적어 주세요."); await api.requestCorrection(qid, aid, u.email, val("cNote")); S.ui = null; toast("정정 요청을 보냈어요"); break;
    case "del": await api.deleteAnswer(qid, aid); S.ui = null; toast("답변을 삭제했어요"); break;
    case "revise": if(!val("rvText")) return fail("답변 내용을 적어 주세요."); await api.submitRevision(qid, aid, val("rvText")); toast("고친 답변을 제출했어요"); break;
    case "assign": { const m = f.querySelector("select").value; await api.assignQuestion(qid, m); toast(m ? "담당 멘토를 배정했어요" : "배정을 해제했어요"); break; }
    case "notice": if(!val("nText")) return fail("공지 내용을 적어 주세요."); await api.setNotice(S.grade, S.subject, val("nText"), u.email); S.ui = null; toast("공지를 고정했어요"); break;
    case "guide": if(!val("gText")) return fail("안내 문구를 적어 주세요."); await api.setLogGuide(val("gText")); toast("안내 문구를 저장했어요"); break;
    case "rreport": await api.reportReview(Number(f.dataset.r), u.email, val("rpReason")); S.ui = null; toast("신고했어요"); break;
    case "addTeacher": {
      const t = val("tEmail").toLowerCase();
      if(!isSchoolEmail(t)) return fail(`${DOMAIN} 로 끝나는 학교 이메일을 입력하세요.`);
      if(store.roster.some(r => r.email === t)) return fail("학생 명단에 있는 이메일이에요.");
      if(store.teacherEmails.includes(t)) return fail("이미 등록된 이메일이에요.");
      await api.addTeacherEmail(t); toast("선생님 이메일을 등록했어요"); break;
    }
    case "roster": {
      const lines = raw("rosterText").split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      if(!lines.length) return fail("명단을 붙여넣어 주세요.");
      const rows = [], bad = [];
      lines.forEach((l, i) => { const [e1, g, n] = l.split(/\t|,/).map(s => s.trim()); const email = (e1 || "").toLowerCase(), grade = Number(g);
        if(!isSchoolEmail(email) || ![1,2,3].includes(grade) || !n || store.teacherEmails.includes(email)) bad.push(i+1); else rows.push({email, grade, name:n}); });
      const r = await api.addRoster(rows);
      S.rosterMsg = `${r.added}명 추가${r.dup ? ` · ${r.dup}명은 이미 있음` : ""}${bad.length ? ` · ${bad.length}줄 형식 오류 (${bad.slice(0,5).join(", ")}번째 줄)` : ""}`;
      toast(`명단에 ${r.added}명을 추가했어요`); break;
    }
    case "log": {
      if(!val("lTitle") || !val("lLearn")) return fail("활동 이름과 알게 된 점은 꼭 적어 주세요.");
      await api.addLog({owner:u.email, date:fmtDate(Date.now()), title:val("lTitle"), kind:val("lKind"), did:val("lDid"), learn:val("lLearn"), next:val("lNext")}); toast("기록을 저장했어요"); break;
    }
    case "review": {
      if(!val("rSub") || !val("rTip")) return fail("과목 이름과 후기를 적어 주세요.");
      if(!f.querySelector("#rAgree").checked) return fail("작성 안내를 확인하고 체크해 주세요.");
      await api.addReview({subject:val("rSub"), grade:Number(val("rGrade")), diff:Number(val("rDiff")), by:`${u.grade}학년 학생`, date:fmtDate(Date.now()), tip:val("rTip"), fit:val("rFit") || "누구나"});
      S.view = null; S.tab = "review"; toast("후기를 올렸어요"); break;
    }
    default: return;
  }
  render();
});

document.addEventListener("input", e => {
  const id = e.target.id;
  if(id === "rSearch"){
    const q = e.target.value.trim().toLowerCase(); let n = 0;
    document.querySelectorAll("[data-rsub]").forEach(c => { const ok = !q || c.dataset.rsub.toLowerCase().includes(q); c.hidden = !ok; if(ok) n++; });
    $("#rEmpty").hidden = n > 0;
  } else if(id === "qSearch"){
    S.qsearch = e.target.value.trim(); let n = 0; const rows = document.querySelectorAll("[data-qtext]");
    rows.forEach(c => { const ok = !S.qsearch || c.dataset.qtext.includes(S.qsearch.toLowerCase()); c.hidden = !ok; if(ok) n++; });
    $("#qEmpty").hidden = n > 0 || !rows.length;
  } else if(id === "aTitle"){
    // 제목에서 두 글자 이상 단어를 뽑아(끝의 조사는 떼고) 기존 질문과 비교한다
    const words = e.target.value.toLowerCase().split(/[\s\[\]().,?!]+/)
      .map(w => w.replace(/(에서|으로|은|는|이|가|을|를|의|에|도|와|과|로)$/, "")).filter(w => w.length >= 2);
    const hits = words.length ? store.questions.filter(q => words.some(w => (q.title + " " + q.body).toLowerCase().includes(w))).slice(0, 3) : [];
    $("#similar").innerHTML = hits.length ? `<div class="info"><span class="t">비슷한 질문이 이미 있어요</span>${hits.map(q => `<button type="button" class="more" data-act="openQ" data-q="${q.id}">${q.grade}학년 ${esc(q.subject)} · ${esc(q.title)} ›</button>`).join("")}<span class="fine">답이 이미 있는지 먼저 확인해 보세요.</span></div>` : "";
  }
});

document.addEventListener("change", async e => {
  if(e.target.id === "qSort"){ S.sort = e.target.value; render(); return; }
  if(e.target.type !== "file") return;
  const img = e.target.parentElement.querySelector("img"); if(!img) return;
  const data = await readImage(e.target.files[0]).catch(() => null);
  img.hidden = !data; if(data) img.src = data;
});

/* 화면 폭이 바뀌면(폰 ↔ 넓은 화면) 보고 있던 질문을 이어서 보여 준다 */
mq.addEventListener?.("change", () => {
  if(mq.matches){ if(S.view?.type === "question"){ S.sel = S.view.id; S.view = null; if(S.tab !== "queue") S.tab = "qa"; } }
  else if(S.sel){ S.view = {type:"question", id:S.sel}; S.sel = null; }
  render();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => render());

if(DB){
  // 예시 데이터는 비우고, 이미 로그인해 둔 세션이 있으면 바로 들어간다
  clearStore();
  $("#app").innerHTML = '<p class="note" style="padding:48px 16px;text-align:center">불러오는 중…</p>';
  dbApi.loadAll().then(e => { const u = e && findUser(e); if(u) Object.assign(S, {me:u.email, grade:u.grade || 2}); })
    .catch(() => {}).finally(render);
} else render();
</script>
