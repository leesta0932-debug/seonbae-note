<style>

:root{

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --accent:#7cc0d4; --accent-soft:#1d3640; --ok:#7fcb9c; --ok-soft:#1b3326; --wait:#e2b65e; --wait-soft:#3a2f17;
  --bad:#f08a7e; --bad-soft:#3d1f1b; color-scheme:dark}}

.by{font-size:13px;font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sup{background:var(--ok-soft);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:4px}

.flash{background:var(--ok-soft);color:var(--ok);padding:8px 12px;border-radius:var(--r);font-size:13.5px;font-weight:600}
.stat{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r)}
.stat>*{padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start;background:none;border:0;font:inherit;color:inherit;text-align:left}

.stat>*+*{border-left:1px solid var(--line)}

.stat span{font-size:12px;color:var(--muted)}
.diff{display:inline-flex;gap:2px}
.diff i{width:8px;height:8px;border-radius:2px;background:var(--line)}
.diff i.f{background:var(--accent)}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more{align-self:flex-start;background:none;border:0;padding:0;font:inherit;font-size:13px;font-weight:600;color:var(--accent);cursor:pointer}
.login{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-block:40px}
.brand{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0}
.note{font-size:12.5px;color:var(--muted);margin:0}
.fine{font-size:11.5px;color:var(--muted);margin:0}
.proto{font-size:12px;color:var(--wait);background:var(--wait-soft);padding:8px 10px;border-radius:var(--r);line-height:1.6}
.mrow{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}

.qimg{max-width:100%;border-radius:var(--r);border:1px solid var(--line)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.check input{width:auto;margin-top:4px}
p{margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* 사진을 1200px 이하로 줄여 글자로 바꾼다. DB 연결 시에는 Supabase Storage에 올리고 주소만 저장한다. */
const readImage = file => new Promise((res, rej) => {
  if(!file) return res(null);
  if(!file.type.startsWith("image/")) return rej(new Error("type"));
  const fr = new FileReader();
  fr.onload = () => { const img = new Image();
    img.onload = () => { const s = Math.min(1, 1200 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", 0.85)); };
    img.onerror = rej; img.src = fr.result; };
  fr.onerror = rej; fr.readAsDataURL(file);
});

const api = {
  async loadAll(){ return true; },   // DB 연결 시: 테이블을 불러와 store를 채운다
  async login(email, pw, role, grade){
    email = email.trim().toLowerCase();
    if(!isSchoolEmail(email)) return {error:`${DOMAIN} 로 끝나는 학교 이메일을 입력하세요. (예: 20301@학교이름${DOMAIN})`};
    const isTeacherEmail = store.teacherEmails.includes(email);
    if(role === "teacher" && !isTeacherEmail) return {error:"등록된 선생님 이메일이 아니에요. 이미 등록된 선생님께 관리 탭에서 등록해 달라고 요청하세요."};
    if(role === "student" && isTeacherEmail) return {error:"선생님으로 등록된 이메일이에요. 위에서 '선생님'을 골라 주세요."};
    let u = findUser(email);
    if(!u){
      if(pw !== INIT_PW) return {error:"처음 로그인한다면 비밀번호는 12345678이에요."};
      u = {email, name:email.split("@")[0], role, grade: role==="student" ? grade : null, mentor:false, pw:INIT_PW, pwChanged:false};
      store.users.push(u);
      if(role === "student") store.logs.push(...exampleLogs(email));
      return {user:u};
    }
    if(u.pw !== pw) return {error: u.pwChanged ? "비밀번호가 맞지 않아요. 처음 로그인할 때 바꾼 비밀번호를 넣어 주세요." : "비밀번호가 맞지 않아요. 처음 비밀번호는 12345678이에요."};
    if(u.role !== role) return {error:`이 이메일은 ${u.role==="teacher"?"선생님":"학생"} 계정이에요. 위에서 역할을 바꿔 주세요.`};
    return {user:u};
  },
  async changePassword(email, next){ const u = findUser(email); u.pw = next; u.pwChanged = true; },
  async addQuestion(q){ const id = nid(); store.questions.unshift({id, at:Date.now(), assignedTo:null, answers:[], ...q}); return id; },
  async addAnswer(qid, author, text, image){ findQ(qid).answers.push(ans(nid(), author, text, Date.now(), {image})); },
  async confirmAnswer(qid, aid, by){
    const q = findQ(qid), a = findA(qid, aid); a.confirmed = {by, at:Date.now()}; a.confusedBy = []; a.corrections = [];
    // 선생님 확인을 받은 학생 답변은 그 학생의 기록장에 자동으로 남긴다
    if(findUser(a.author)?.role === "student") store.logs.unshift({id:nid(), owner:a.author, auto:true, date:fmtDate(Date.now()),
      title:`${q.grade}학년 ${q.subject} 질문에 답변`, kind:"멘토 활동", did:`"${q.title}" 질문에 답변을 쓰고 선생님 확인을 받음`, learn:"", next:""});
  },
  async addSupplement(qid, aid, by, text){ findA(qid, aid).supplements.push({by, text, at:Date.now()}); },
  async hideAnswer(qid, aid, by, reason, memo){ const a = findA(qid, aid); a.status = "hidden"; a.hide = {reason, memo, by, at:Date.now()}; a.confusedBy = []; a.corrections = []; },
  async requestRevision(qid, aid, by, note){ const a = findA(qid, aid); a.status = "revising"; a.revision = {note, by, at:Date.now()}; },
  async submitRevision(qid, aid, text){ const a = findA(qid, aid); a.text = text; a.status = "resubmitted"; a.revisedAt = Date.now(); },
  async restoreAnswer(qid, aid){ const a = findA(qid, aid); a.status = "visible"; a.hide = null; a.revision = null; },
  async deleteAnswer(qid, aid){ const q = findQ(qid); q.answers = q.answers.filter(a => a.id !== aid); },
  async toggleConfused(qid, aid, email){ const a = findA(qid, aid);
    a.confusedBy = a.confusedBy.includes(email) ? a.confusedBy.filter(e => e !== email) : [...a.confusedBy, email]; },
  async requestCorrection(qid, aid, by, note){ findA(qid, aid).corrections.push({by, note, at:Date.now()}); },
  async clearFlags(qid, aid){ const a = findA(qid, aid); a.confusedBy = []; a.corrections = []; },
  async assignQuestion(qid, email){ findQ(qid).assignedTo = email || null; },
  async setMentor(email, on){ findUser(email).mentor = on; },
  async addReview(r){ store.reviews.unshift({id:nid(), hidden:false, reports:[], ...r}); },
  async setReviewHidden(id, hidden){ store.reviews.find(r => r.id === id).hidden = hidden; },
  async reportReview(id, by, reason){ store.reviews.find(r => r.id === id).reports.push({by, reason, at:Date.now()}); },
  async clearReviewReports(id){ store.reviews.find(r => r.id === id).reports = []; },
  async addTeacherEmail(email){ if(!store.teacherEmails.includes(email)) store.teacherEmails.push(email); },
  async setNotice(grade, subject, text, by){
    const n = store.notices.find(x => x.grade === grade && x.subject === subject);
    if(n){ n.text = text; n.by = by; n.at = Date.now(); } else store.notices.unshift({id:nid(), grade, subject, text, by, at:Date.now()});
  },
  async removeNotice(id){ store.notices = store.notices.filter(n => n.id !== id); },
  async addLog(l){ store.logs.unshift({id:nid(), ...l}); },
  async setLogGuide(t){ store.logGuide = t; }
};

                   : [["home","홈"],["qa","질문방"],["log","기록장"],["review","과목 후기"]];

  app.innerHTML = `<header class="top">${head}</header><main>${body}</main><nav class="tabs" style="grid-template-columns:repeat(${tabs.length},1fr)">${nav}</nav>`;
}

function inlineForm(q, a){
  const ui = S.ui; if(!ui || ui.a !== a.id) return "";
  const attrs = `data-q="${q.id}" data-a="${a.id}" class="box" novalidate`;
  const btns = label => `<p class="err" hidden></p><div class="actions"><button class="sbtn primary" type="submit">${label}</button><button class="sbtn" type="button" data-act="uiClose">취소</button></div>`;
  switch(ui.mode){
    case "hide": return `<form data-form="hide" ${attrs}><div class="field"><label for="hReason">숨기는 이유</label><select id="hReason">${REASONS.map(r => `<option>${r}</option>`).join("")}</select></div>
      <div class="field"><label for="hMemo">짧은 설명 (선택)</label><input id="hMemo" placeholder="예: 관성의 크기는 질량으로 정해져요."></div>
      <p class="fine">학생에게는 답변 대신 숨긴 이유가 보여요. 나중에 다시 공개할 수 있어요.</p>${btns("숨기기")}</form>`;
    case "req": return `<form data-form="req" ${attrs}><div class="field"><label for="rNote">멘토에게 보낼 수정 요청</label><textarea id="rNote" placeholder="어떤 부분이 왜 틀렸는지, 어떻게 고치면 좋을지 적어 주세요."></textarea></div>${btns("요청 보내기")}</form>`;
    case "sup": return `<form data-form="sup" ${attrs}><div class="field"><label for="sText">보충 설명</label><textarea id="sText" placeholder="멘토 답변에 덧붙일 설명"></textarea></div>${btns("덧붙이기")}</form>`;
    case "corr": return `<form data-form="corr" ${attrs}><div class="field"><label for="cNote">정정 요청 내용</label><textarea id="cNote" placeholder="어느 부분을 어떻게 고치면 좋을지 적어 주세요. 선생님 검토함으로 가요."></textarea></div>${btns("보내기")}</form>`;
    case "del": return `<form data-form="del" ${attrs}><p>이 답변을 삭제하면 되돌릴 수 없어요. 삭제할까요?</p><div class="actions"><button class="sbtn danger" type="submit">삭제</button><button class="sbtn" type="button" data-act="uiClose">취소</button></div></form>`;
  }
  return "";
}
function answerBlock(q, a){
  const u = me(), isT = u.role === "teacher", mine = a.author === u.email, vis = a.status === "visible";
  const d = `data-q="${q.id}" data-a="${a.id}"`;
  if(!vis && !isT && !mine){
    const msg = a.status === "hidden" ? "선생님이 검토 중인 답변이에요." : a.status === "revising" ? "멘토가 답변을 고치는 중이에요." : "멘토가 고친 답변을 선생님이 확인하고 있어요.";
    return `<div class="answer dim"><span class="by">${esc(nameOf(a.author))}${roleBadge(a.author)}</span><p class="note">${msg} 사유: ${esc(a.hide?.reason || "검토 중")}</p></div>`;
  }
  let h = `<div class="answer ${vis?"":"dim"}"><span class="by">${esc(nameOf(a.author))}${roleBadge(a.author)}${vis?"":`<span class="pill bad">${STATUS_LABEL[a.status]}</span>`}${a.confirmed?'<span class="pill ok">교사 확인</span>':""}</span>
    <p>${esc(a.text)}</p>${a.image?`<img class="qimg" src="${a.image}" alt="답변에 첨부한 사진">`:""}<span class="meta">${ago(a.at)}${a.revisedAt?" · 수정됨":""}</span>`;
  if(a.confirmed) h += `<span class="fine">교사 확인 · ${esc(nameOf(a.confirmed.by))} · ${fmtDate(a.confirmed.at)}</span>`;
  if(a.hide) h += `<div class="info"><span class="t">숨긴 이유: ${esc(a.hide.reason)}</span>${a.hide.memo?`<span>${esc(a.hide.memo)}</span>`:""}<span class="fine">${esc(nameOf(a.hide.by))} · ${fmtDate(a.hide.at)}</span></div>`;
  if(a.revision) h += `<div class="info"><span class="t">수정 요청</span><span>${esc(a.revision.note)}</span><span class="fine">${esc(nameOf(a.revision.by))} · ${fmtDate(a.revision.at)}</span></div>`;
  h += a.supplements.map(s => `<div class="sup"><span class="by">보충 설명 · ${esc(nameOf(s.by))}</span><p>${esc(s.text)}</p></div>`).join("");
  if(isT && vis && (a.confusedBy.length || a.corrections.length)){
    h += `<div class="info">${a.confusedBy.length?`<span class="flag">이해가 안 된다는 학생 ${a.confusedBy.length}명</span>`:""}
      ${a.corrections.map(c => `<span><span class="flag">정정 요청</span> ${esc(nameOf(c.by))}: ${esc(c.note)}</span>`).join("")}</div>`;
  }
  let acts = "";
  if(isT){
    if(vis) acts = `${a.confirmed?"":`<button class="sbtn primary" data-act="confirm" ${d}>교사 확인</button>`}
      <button class="sbtn" data-act="ui" data-v="sup" ${d}>보충 설명</button><button class="sbtn" data-act="ui" data-v="hide" ${d}>숨기기</button>
      ${a.confusedBy.length||a.corrections.length?`<button class="sbtn" data-act="clearFlags" ${d}>검토 완료</button>`:""}`;
    else if(a.status === "hidden") acts = `<button class="sbtn primary" data-act="restore" ${d}>다시 공개</button><button class="sbtn" data-act="ui" data-v="req" ${d}>멘토에게 수정 요청</button><button class="sbtn danger" data-act="ui" data-v="del" ${d}>삭제</button>`;
    else if(a.status === "revising") acts = `<button class="sbtn" data-act="restore" ${d}>요청 취소하고 공개</button><button class="sbtn danger" data-act="ui" data-v="del" ${d}>삭제</button>`;
    else acts = `<button class="sbtn primary" data-act="restore" ${d}>수정본 공개</button><button class="sbtn" data-act="ui" data-v="req" ${d}>다시 수정 요청</button><button class="sbtn danger" data-act="ui" data-v="del" ${d}>삭제</button>`;
  } else if(mine && a.status === "revising"){
    h += `<form data-form="revise" data-q="${q.id}" data-a="${a.id}" class="box" novalidate><div class="field"><label for="rvText">답변 고치기</label><textarea id="rvText">${esc(a.text)}</textarea></div>
      <p class="err" hidden></p><button class="sbtn primary" type="submit" style="align-self:flex-start">고친 답변 제출</button><p class="fine">제출하면 선생님이 확인한 뒤 다시 공개돼요.</p></form>`;
  } else if(vis && !mine){
    const on = a.confusedBy.includes(u.email);
    acts = `<button class="sbtn ${on?"on":""}" data-act="confused" ${d}>${on?"이해가 안 돼요 표시함":"이해가 안 돼요"}</button>${u.mentor?`<button class="sbtn" data-act="ui" data-v="corr" ${d}>정정 요청</button>`:""}`;
  }
  if(acts) h += `<div class="actions">${acts}</div>`;
  return h + inlineForm(q, a) + `</div>`;
}

  const mentors = store.users.filter(u => u.mentor);
  let body;
  if(S.queueTab === "unanswered"){
    body = `<p class="note">답변이 하나도 없는 질문이에요. 오래 기다린 순서예요.</p>` + (unanswered().map(q => `<div class="box"><span class="meta"><span class="pill wait">${waiting(q.at)}</span><span>${q.grade}학년 · ${esc(q.subject)}</span><span class="tag">${esc(q.stuck)}</span></span>

      <button class="sbtn" type="submit">배정</button></form>
      <button class="sbtn primary" style="align-self:flex-start" data-act="openQ" data-q="${q.id}">직접 답하기</button></div>`).join("") || empty("미답변 질문이 없어요."));
  } else if(S.queueTab === "flagged"){
    body = `<p class="note">학생이 "이해가 안 돼요"를 눌렀거나 멘토가 정정을 요청한 답변이에요.</p><div class="list">` + (flagged().map(p => pairRow(p,
      `${p[1].confusedBy.length?`<span class="pill wait">이해 안 됨 ${p[1].confusedBy.length}</span>`:""}${p[1].corrections.length?`<span class="pill bad">정정 요청 ${p[1].corrections.length}</span>`:""}`)).join("") || empty("검토 요청이 없어요.")) + `</div>`;
  } else if(S.queueTab === "resub"){
    body = `<p class="note">멘토가 수정 요청을 받고 고친 답변이에요. 확인하고 공개해 주세요.</p><div class="list">` + (resubmitted().map(p => pairRow(p, '<span class="pill ans">수정 완료</span>')).join("") || empty("고친 답변이 없어요.")) + `</div>`;
  } else {
    body = `<p class="note">숨기거나 수정을 요청한 답변이에요. 학생에게는 사유만 보여요.</p><div class="list">` + (hiddenOnes().map(p => pairRow(p, `<span class="pill bad">${STATUS_LABEL[p[1].status]}</span><span class="tag">${esc(p[1].hide?.reason||"")}</span>`)).join("") || empty("숨긴 답변이 없어요.")) + `</div>`;
  }
  return seg + body;
}

  return `${isT ? "" : `<button class="btn" data-act="writeReview">후기 작성하기</button>`}
    <p class="note">수강한 선배들이 남긴 과목 후기예요. 과목 선택 전에 참고하세요.</p>
    <div class="field"><label for="rSearch">과목 검색</label><input id="rSearch" type="search" placeholder="예: 미적분, 화학"></div>
    <p class="note" id="rEmpty" hidden>검색한 과목의 후기가 아직 없어요.</p>
    ${list.map(r => `<div class="box" data-rsub="${esc(r.subject)}" ${r.hidden?'style="opacity:.6"':""}><div class="meta"><span class="t" style="font-size:15px;color:var(--ink)">${esc(r.subject)}</span><span>${r.grade}학년 과목</span>${r.hidden?'<span class="pill bad">숨김</span>':""}</div>
      <div class="meta">난이도 ${diffBar(r.diff)}</div><p class="clamp">${esc(r.tip)}</p>${r.tip.length>78?`<button class="more" data-act="rdetail" data-v="${r.id}">자세히 보기 ›</button>`:""}
      <p class="note">추천: ${esc(r.fit)} · ${esc(r.by)} · ${esc(r.date)} 작성</p>
      ${isT ? `${r.reports.length?`<div class="info"><span class="flag">신고 ${r.reports.length}건</span>${r.reports.map(x => `<span>${esc(x.reason)}</span>`).join("")}</div>`:""}
        <div class="actions"><button class="sbtn ${r.hidden?"primary":""}" data-act="rhide" data-v="${r.id}" data-on="${r.hidden?0:1}">${r.hidden?"다시 공개":"후기 숨기기"}</button>${r.reports.length?`<button class="sbtn" data-act="rclear" data-v="${r.id}">신고 확인 완료</button>`:""}</div>` : reportArea(r)}</div>`).join("")}
    <p class="fine">추천 대상은 참고용이며 개인차가 있어요.</p>`;
}
function reportArea(r){
  if(r.reports.some(x => x.by === S.me)) return `<p class="fine">신고했어요. 선생님이 확인할 거예요.</p>`;
  if(S.ui?.mode === "rreport" && S.ui.r === r.id) return `<form data-form="rreport" data-r="${r.id}" class="box" novalidate>
    <div class="field"><label for="rpReason">신고 이유</label><select id="rpReason">${REPORTS.map(x => `<option>${x}</option>`).join("")}</select></div>
    <div class="actions"><button class="sbtn danger" type="submit">신고하기</button><button class="sbtn" type="button" data-act="uiClose">취소</button></div></form>`;
  return `<button class="more" style="color:var(--muted)" data-act="rreportOpen" data-v="${r.id}">신고</button>`;
}
function reviewDetailView(id){
  const r = store.reviews.find(x => x.id === id);
  return `<div style="display:flex;flex-direction:column;gap:8px"><span class="meta">${r.grade}학년 과목 · ${esc(r.by)} · ${esc(r.date)} 작성</span>
    <h2 style="font-size:18px">${esc(r.subject)}</h2><div class="meta">난이도 ${diffBar(r.diff)}</div>
    <p>${esc(r.tip)}</p><p class="note">추천: ${esc(r.fit)}</p><p class="fine">추천 대상은 참고용이며 개인차가 있어요.</p></div>`;
}
function reviewFormView(){
  return `<form data-form="review" style="display:flex;flex-direction:column;gap:14px" novalidate>
    <div class="field"><label for="rSub">과목 이름</label><input id="rSub" placeholder="예: 미적분Ⅰ"></div>
    <div class="field"><label for="rGrade">몇 학년 과목인가요?</label><select id="rGrade"><option value="1">1학년</option><option value="2" selected>2학년</option><option value="3">3학년</option></select></div>
    <div class="field"><label for="rDiff">난이도</label><select id="rDiff"><option value="1">1 (쉬움)</option><option value="2">2</option><option value="3" selected>3 (보통)</option><option value="4">4</option><option value="5">5 (어려움)</option></select></div>
    <div class="field"><label for="rTip">공부법과 후기</label><textarea id="rTip" placeholder="수업 분위기, 시험 스타일, 공부할 때 팁"></textarea></div>
    <div class="field"><label for="rFit">이런 학생에게 추천해요</label><input id="rFit" placeholder="예: 이공계 진로, 계산을 좋아하는 학생"><p class="fine">추천 대상은 참고용이며 개인차가 있어요.</p></div>
    <div class="info"><span class="t">작성 전에 확인해 주세요</span><span>과목 내용, 공부법, 시험 스타일 위주로 써 주세요. 특정 선생님에 대한 평가나 이름은 쓰지 마세요. 안내에 맞지 않는 후기는 신고되면 숨겨질 수 있어요.</span></div>
    <label class="check"><input id="rAgree" type="checkbox"><span>위 내용을 확인했어요</span></label>
    <p class="note">작성일: ${fmtDate(Date.now())} (올리면 자동으로 표시돼요)</p>
    <p class="err" hidden></p><button class="btn" type="submit">후기 올리기</button></form>`;
}

/* ===== 이벤트 ===== */
const pwProblem = (np, np2) => np.length < 8 ? "새 비밀번호는 8자 이상이어야 해요."
  : np === INIT_PW ? "처음 비밀번호(12345678)와 다르게 정해 주세요." : np !== np2 ? "두 비밀번호가 서로 달라요." : "";

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const {act, v} = el.dataset, qid = Number(el.dataset.q), aid = Number(el.dataset.a), u = me();
  S.flash = "";
  switch(act){
    case "role": S.draft = {email:$("#email").value, pw:$("#pw").value, grade:Number($("#grade")?.value || S.draft.grade || 2)}; S.loginRole = v; break;
    case "logout": S.me = null; S.view = null; S.ui = null; S.tab = "home"; S.draft = {}; break;
    case "tab": S.tab = v; S.view = null; S.ui = null; break;
    case "account": S.view = {type:"account"}; S.ui = null; break;
    case "back": S.view = null; S.ui = null; break;
    case "openQ": S.view = {type:"question", id:qid}; S.ui = null; break;
    case "ask": S.view = {type:"ask"}; break;
    case "grade": S.grade = Number(v); S.subject = "전체"; S.ui = null; break;
    case "sub": S.subject = v; S.ui = null; break;
    case "ui": S.ui = {mode:v, a:aid}; break;
    case "uiClose": S.ui = null; break;
    case "confirm": await api.confirmAnswer(qid, aid, u.email); break;
    case "restore": await api.restoreAnswer(qid, aid); S.ui = null; break;
    case "confused": await api.toggleConfused(qid, aid, u.email); break;
    case "clearFlags": await api.clearFlags(qid, aid); break;
    case "queue": S.tab = "queue"; S.queueTab = v; S.view = null; break;
    case "qtab": S.queueTab = v; break;
    case "mentor": await api.setMentor(v, el.dataset.on === "1"); break;
    case "writeReview": S.view = {type:"review"}; break;
    case "rdetail": S.view = {type:"reviewDetail", id:Number(v)}; break;
    case "rhide": await api.setReviewHidden(Number(v), el.dataset.on === "1"); break;
    case "noticeEdit": S.ui = {mode:"notice"}; break;
    case "noticeRemove": await api.removeNotice(Number(v)); break;
    case "rreportOpen": S.ui = {mode:"rreport", r:Number(v)}; break;
    case "rclear": await api.clearReviewReports(Number(v)); break;
    default: return;
  }
  render();
});

document.addEventListener("submit", async e => {
  const f = e.target, kind = f.dataset.form; if(!kind) return;
  e.preventDefault();
  const val = id => (f.querySelector("#"+id)?.value || "").trim();
  const raw = id => f.querySelector("#"+id)?.value || "";
  const fail = msg => { const p = f.querySelector(".err"); if(p){ p.textContent = msg; p.hidden = false; } };
  const qid = Number(f.dataset.q), aid = Number(f.dataset.a), u = me();
  S.flash = "";
  switch(kind){
    case "login": {
      S.draft = {email:raw("email"), pw:"", grade:Number(val("grade") || 2)};
      const r = await api.login(raw("email"), raw("pw"), S.loginRole, Number(val("grade") || 2));
      if(r.error) return fail(r.error);
      await api.loadAll();
      S.me = r.user.email; S.grade = r.user.grade || 2; S.subject = "전체"; S.tab = "home"; S.view = null; S.draft = {}; break;
    }
    case "firstPw": { const p = pwProblem(raw("np"), raw("np2")); if(p) return fail(p); await api.changePassword(u.email, raw("np")); break; }
    case "changePw": {
      if(raw("cp") !== u.pw) return fail("현재 비밀번호가 맞지 않아요.");
      const p = pwProblem(raw("np"), raw("np2")); if(p) return fail(p);
      await api.changePassword(u.email, raw("np")); S.flash = "비밀번호를 바꿨어요."; break;
    }
    case "ask": {
      if(!val("aTitle") || !val("aBody")) return fail("제목과 내용을 모두 적어 주세요.");
      const image = await readImage(f.querySelector("#aImg").files[0]).catch(() => "bad");
      if(image === "bad") return fail("사진 파일만 올릴 수 있어요.");
      const id = await api.addQuestion({grade:u.grade, subject:val("aSub"), stuck:val("aStuck"), title:val("aTitle"), body:val("aBody"), author:u.email, image});
      S.tab = "qa"; S.grade = u.grade; S.subject = "전체"; S.view = {type:"question", id}; break;
    }
    case "answer": {
      if(!val("ans")) return fail("답변 내용을 적어 주세요.");
      const image = await readImage(f.querySelector("#ansImg").files[0]).catch(() => "bad");
      if(image === "bad") return fail("사진 파일만 올릴 수 있어요.");
      await api.addAnswer(qid, u.email, val("ans"), image); break;
    }
    case "rreport": await api.reportReview(Number(f.dataset.r), u.email, val("rpReason")); S.ui = null; break;
    case "addTeacher": {
      const t = val("tEmail").toLowerCase();
      if(!isSchoolEmail(t)) return fail(`${DOMAIN} 로 끝나는 학교 이메일을 입력하세요.`);
      if(findUser(t)?.role === "student") return fail("이미 학생 계정으로 쓰고 있는 이메일이에요.");
      await api.addTeacherEmail(t); break;
    }
    case "hide": await api.hideAnswer(qid, aid, u.email, val("hReason"), val("hMemo")); S.ui = null; break;
    case "req": if(!val("rNote")) return fail("요청 내용을 적어 주세요."); await api.requestRevision(qid, aid, u.email, val("rNote")); S.ui = null; break;
    case "sup": if(!val("sText")) return fail("설명을 적어 주세요."); await api.addSupplement(qid, aid, u.email, val("sText")); S.ui = null; break;
    case "corr": if(!val("cNote")) return fail("정정할 내용을 적어 주세요."); await api.requestCorrection(qid, aid, u.email, val("cNote")); S.ui = null; break;
    case "del": await api.deleteAnswer(qid, aid); S.ui = null; break;
    case "revise": if(!val("rvText")) return fail("답변 내용을 적어 주세요."); await api.submitRevision(qid, aid, val("rvText")); break;
    case "assign": await api.assignQuestion(qid, f.querySelector("select").value); break;
    case "notice": if(!val("nText")) return fail("공지 내용을 적어 주세요."); await api.setNotice(S.grade, S.subject, val("nText"), u.email); S.ui = null; break;
    case "guide": if(!val("gText")) return fail("안내 문구를 적어 주세요."); await api.setLogGuide(val("gText")); S.flash = "안내 문구를 저장했어요."; break;
    case "log": {
      if(!val("lTitle") || !val("lLearn")) return fail("활동 이름과 알게 된 점은 꼭 적어 주세요.");
      await api.addLog({owner:u.email, date:fmtDate(Date.now()), title:val("lTitle"), kind:val("lKind"), did:val("lDid"), learn:val("lLearn"), next:val("lNext")}); break;
    }
    case "review": {
      if(!val("rSub") || !val("rTip")) return fail("과목 이름과 후기를 적어 주세요.");
      if(!f.querySelector("#rAgree").checked) return fail("작성 안내를 확인하고 체크해 주세요.");
      await api.addReview({subject:val("rSub"), grade:Number(val("rGrade")), diff:Number(val("rDiff")), by:`${u.grade}학년 학생`, date:fmtDate(Date.now()), tip:val("rTip"), fit:val("rFit") || "누구나"});
      S.view = null; S.tab = "review"; break;
    }
    default: return;
  }
  render();
});

document.addEventListener("input", e => {
  const id = e.target.id;
  if(id === "rSearch" || id === "qSearch"){
    const r = id === "rSearch", q = e.target.value.trim().toLowerCase(); let n = 0;
    document.querySelectorAll(r ? "[data-rsub]" : "[data-qtext]").forEach(c => {
      const ok = !q || (r ? c.dataset.rsub : c.dataset.qtext).toLowerCase().includes(q); c.hidden = !ok; if(ok) n++; });
    $(r ? "#rEmpty" : "#qEmpty").hidden = n > 0;
  } else if(id === "aTitle"){
    // 제목에서 두 글자 이상 단어를 뽑아(끝의 조사는 떼고) 기존 질문과 비교한다
    const words = e.target.value.toLowerCase().split(/[\s\[\]().,?!]+/)
      .map(w => w.replace(/(에서|으로|은|는|이|가|을|를|의|에|도|와|과|로)$/, "")).filter(w => w.length >= 2);
    const hits = words.length ? store.questions.filter(q => words.some(w => (q.title + " " + q.body).toLowerCase().includes(w))).slice(0, 3) : [];
    $("#similar").innerHTML = hits.length ? `<div class="info"><span class="t">비슷한 질문이 이미 있어요</span>${hits.map(q => `<button type="button" class="more" data-act="openQ" data-q="${q.id}">${q.grade}학년 ${esc(q.subject)} · ${esc(q.title)} ›</button>`).join("")}<span class="fine">답이 이미 있는지 먼저 확인해 보세요.</span></div>` : "";
  }
});

document.addEventListener("change", async e => {
  if(e.target.type !== "file") return;
  const img = e.target.parentElement.querySelector("img"); if(!img) return;
  const data = await readImage(e.target.files[0]).catch(() => null);
  img.hidden = !data; if(data) img.src = data;
});

render();
</script>

</body></html>
